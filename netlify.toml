[build]
  command = "node scripts/build-content.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Pretty-print JSON isn't minified by the build script, which is fine —
# these files are small and rarely change per request.
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
